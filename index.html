<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>KiyoraSMP</title>
</head>

<body>

    <h1>KiyoraSMP</h1>

    <button id="openButton" onclick="powerServer('start')">
        OUVRIR
    </button>

    <button id="restartButton" onclick="powerServer('restart')">
        REDÉMARRER
    </button>

    <p id="message"></p>

    <script>
        const API =
            "https://kiyorasmpp.httpskiyorasmppkiyorasmpworkersdev.workers.dev";

        async function powerServer(action) {

            const openButton =
                document.getElementById("openButton");

            const restartButton =
                document.getElementById("restartButton");

            const message =
                document.getElementById("message");

            openButton.disabled = true;
            restartButton.disabled = true;

            if (action === "start") {
                message.textContent =
                    "Ouverture du serveur...";
            } else {
                message.textContent =
                    "Redémarrage du serveur...";
            }

            try {

                const response =
                    await fetch(API + "/power", {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            action: action
                        })
                    });

                const data =
                    await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(
                        data.error || "Erreur"
                    );
                }

                if (action === "start") {

                    message.textContent =
                        "✅ Serveur ouvert !";

                } else {

                    message.textContent =
                        "✅ Serveur redémarré !";

                }

            } catch (error) {

                message.textContent =
                    "❌ " + error.message;

            } finally {

                openButton.disabled = false;
                restartButton.disabled = false;
            }
        }
    </script>

</body>
</html>
