<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiyoraSMP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            <div class="logo-box">K</div>
            <div>
                <h2>KIYORA<span>SMP</span></h2>
                <small>SERVEUR MINECRAFT</small>
            </div>
        </div>

        <div class="server">

            <div class="badge">
                ● SERVEUR MINECRAFT
            </div>

            <h1>KiyoraSMP</h1>

            <p>
                Le serveur Minecraft chill, français et sans prise de tête.
            </p>

            <div id="status" class="status">
                ● Connexion...
            </div>

            <div class="ip">
                🌐
                <strong>kiyorasmp.minecraft.how</strong>
            </div>

            <button
                id="startButton"
                onclick="startServer()"
            >
                ▶ &nbsp; DÉMARRER LE SERVEUR
            </button>

            <div id="message"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
